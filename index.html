<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Noble Performance Hub</title>
<style>
:root{--bg:#f4f1eb;--card:#fff;--ink:#18211f;--muted:#6c746f;--line:#ddd9d0;--accent:#29443d;--soft:#d9e5df;--warn:#9a6a21}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,sans-serif}.app{max-width:1180px;margin:auto;min-height:100vh}.top{padding:28px 24px 16px;display:flex;justify-content:space-between;align-items:end;gap:20px}.brand{font-size:13px;letter-spacing:.18em;font-weight:800;color:var(--accent)}h1{font-size:30px;margin:5px 0}.date,.muted{color:var(--muted);font-size:13px}nav{display:flex;gap:6px;padding:0 24px 18px;overflow:auto}nav button{border:0;background:transparent;padding:10px 15px;border-radius:12px;color:var(--muted);font-weight:700;white-space:nowrap;cursor:pointer}nav button.active{background:var(--accent);color:white}main{padding:0 24px 40px}.hero{background:var(--accent);color:white;border-radius:22px;padding:24px;margin-bottom:16px}.hero small{opacity:.75;font-weight:800;letter-spacing:.08em}.hero h2{font-size:27px;margin:7px 0}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}.s4{grid-column:span 4}.s6{grid-column:span 6}.s8{grid-column:span 8}.s12{grid-column:span 12}.card h3{margin:0 0 12px}.metric{font-size:30px;font-weight:800}.pill,.tag{display:inline-block;background:var(--soft);padding:5px 9px;border-radius:999px;font-size:11px;font-weight:800}.bar{height:9px;background:#e9e7e1;border-radius:99px;overflow:hidden;margin:8px 0 15px}.fill{height:100%;background:var(--accent)}button.primary,.choice{border:0;background:var(--accent);color:#fff;padding:10px 14px;border-radius:11px;font-weight:800;cursor:pointer}.choice{background:#eeeae2;color:var(--ink)}.choice.selected{background:var(--accent);color:white}.status,.notice{margin-top:12px;padding:12px;border-radius:12px;background:#f3f0e9}.notice{border-left:4px solid var(--warn)}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:10px 0}.timeline{display:grid}.item{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}.time{font-weight:800;width:60px;flex:none}.check{display:flex;gap:10px;align-items:center;padding:9px 0}.check input{width:auto}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}input,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:white;font:inherit}.full{grid-column:1/-1}.meals{display:grid;grid-template-columns:1fr 1fr;gap:12px}.meal{border:1px solid var(--line);border-radius:14px;padding:14px}.meal b{display:block;margin-bottom:5px}.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}footer{padding:15px 24px 30px;color:var(--muted);font-size:12px}@media(max-width:800px){.s4,.s6,.s8{grid-column:span 12}.meals,.form{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
</style>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#29443d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Noble Hub"></head>
<body>
<div class="app">
<header class="top"><div><div class="brand">NOBLE PERFORMANCE HUB</div><h1>Performance first. Fat loss second.</h1></div><div class="date" id="date"></div></header>
<nav id="nav"></nav><main id="main"></main>
<footer>V8 prototype • WHOOP data is entered manually in this version. The app does not automatically connect to WHOOP.</footer>
</div>
<script>
const defaults={tab:"Home",recovery:78,sleep:86,weight:70,energy:7,strength:"Stable",bodyfat:"",twoMatch:false,done:{water:false,protein:false,mobility:false,sleep:false}};
const state=Object.assign(defaults,JSON.parse(localStorage.getItem("nobleHub")||"{}"));
function save(){localStorage.setItem("nobleHub",JSON.stringify(state))}
function setTab(t){state.tab=t;save();render()}
function nav(){document.getElementById("nav").innerHTML=["Home","Nutrition","Recovery","Performance","Calendar","Profile"].map(t=>`<button class="${state.tab===t?"active":""}" onclick="setTab('${t}')">${t}</button>`).join("")}
function coach(){let r=+state.recovery,s=+state.sleep;if(r<50&&s<75)return["RED · RECOVER","Recovery is today's priority. Hit protein, keep carbs adequate, hydrate, skip extra conditioning and protect sleep."];if(r<60||s<75)return["AMBER · MANAGE","Complete the required work, but don't add unnecessary conditioning or aggressively restrict food."];return["GREEN · GO","You're ready to use today. Fuel the work, complete the session and recover properly."]}
function home(){let c=coach();return `<div class="hero"><small>TODAY'S MISSION</small><h2>TRAIN HARD. FUEL WELL. RECOVER BETTER.</h2><p><b>${c[0]}</b> — ${c[1]}</p></div><div class="grid">
<section class="card s4"><h3>WHOOP recovery</h3><div class="metric">${state.recovery}</div><div class="muted">Manual input</div><div class="bar"><div class="fill" style="width:${state.recovery}%"></div></div><button class="primary" onclick="setTab('Recovery')">Update</button></section>
<section class="card s4"><h3>Sleep performance</h3><div class="metric">${state.sleep}%</div><div class="muted">Target: ~8 hours</div><div class="bar"><div class="fill" style="width:${state.sleep}%"></div></div><button class="primary" onclick="setTab('Recovery')">Recovery plan</button></section>
<section class="card s4"><h3>Body composition</h3><div class="metric">${state.weight} kg</div><div class="muted">Goal: ≤65 kg by Christmas</div><div class="status"><b>Track the trend.</b><br>Weight is not the only success metric.</div></section>
<section class="card s8"><h3>Today's coach</h3><div class="notice"><b>${c[0]}</b><br>${c[1]}</div><div class="timeline"><div class="item"><span class="time">AM</span><span><b>Fuel</b><br><span class="muted">Match carbohydrate intake to today's workload.</span></span></div><div class="item"><span class="time">POST</span><span><b>Recover</b><br><span class="muted">Protein + carbohydrate after training, especially if lunch is poor.</span></span></div><div class="item"><span class="time">PM</span><span><b>Reset</b><br><span class="muted">3–3.5L fluids on hard/match days and protect an 8h sleep opportunity.</span></span></div></div></section>
<section class="card s4"><h3>Quick checklist</h3>${[["water","3L+ fluids"],["protein","Protein target"],["mobility","10–15 min recovery"],["sleep","Wind down for 8h"]].map(x=>`<label class="check"><input type="checkbox" ${state.done[x[0]]?"checked":""} onchange="toggle('${x[0]}')">${x[1]}</label>`).join("")}</section></div>`}
const meals=[["Spicy salmon rice bowl","Salmon, jasmine rice, edamame, cucumber, tenderstem broccoli, chilli-soy","High-carb • Fish • Asian"],["Beef & pak choi noodles","Lean beef, noodles, pak choi, mushrooms, spinach, ginger and chilli","High-carb • Beef • Spicy"],["Creamy salmon tomato pasta","Salmon, pasta, cherry tomatoes, spinach and light creamy sauce","Carbs • Fish • Easy"],["Tuna sushi bowl","Sushi rice, tuna, cucumber, avocado, edamame and sesame","Carbs • Fish • Quick"],["Steak, rice & greens","Lean steak, white rice, tenderstem broccoli and tomatoes","Protein • Beef • Simple"],["Chicken noodle broth","Chicken, noodles, pak choi, mushrooms, spinach and spicy broth","Carbs • Chicken • Recovery"]];
function nutrition(){return `<div class="grid"><section class="card s4"><h3>Daily fuel</h3><div class="row"><b>Protein</b><span class="pill">~150g</span></div><p class="muted">Keep steady to support muscle retention.</p><div class="row"><b>Carbs</b><span class="pill">Load-based</span></div><p class="muted">High on hard training and match days; more moderate on rest days.</p><div class="row"><b>Fluids</b><span class="pill">≥3L</span></div></section><section class="card s8"><h3>Training-centre portions</h3><p><b>High load:</b> 2 carb + 1–2 protein + 1–2 veg + 1 moderate fat portion.</p><p><b>Rest:</b> 1 moderate carb + 1–2 protein + 2 veg + 1 fat portion.</p><p class="muted">If lunch is poor, use a protein shake and eat a proper dinner rather than arriving home starving.</p></section><section class="card s12"><h3>WHAT SHOULD I EAT?</h3><div class="meals">${meals.map(m=>`<div class="meal"><b>${m[0]}</b><span class="muted">${m[1]}</span><div class="tags">${m[2].split(" • ").map(x=>`<span class="tag">${x}</span>`).join("")}</div></div>`).join("")}</div></section></div>`}
function recovery(){let c=coach();return `<div class="grid"><section class="card s6"><h3>WHOOP check-in</h3><div class="form"><label>Recovery<input id="r" type="number" min="0" max="100" value="${state.recovery}"></label><label>Sleep %<input id="s" type="number" min="0" max="100" value="${state.sleep}"></label><label>Weight kg<input id="w" type="number" step=".1" value="${state.weight}"></label><label>Energy 1–10<input id="e" type="number" min="1" max="10" value="${state.energy}"></label><button class="primary full" onclick="update()">Save check-in</button></div></section><section class="card s6"><h3>Recovery engine</h3><div class="notice"><b>${c[0]}</b><br>${c[1]}</div><p><b>Low recovery:</b> no extra conditioning and no aggressive calorie restriction.</p><p><b>Good recovery:</b> use it — attack the planned session and refuel.</p></section><section class="card s12"><h3>Recovery checklist</h3>${[["water","≥3L fluids"],["protein","~150g protein"],["mobility","10–15 min mobility/recovery"],["sleep","8h sleep opportunity"]].map(x=>`<label class="check"><input type="checkbox" ${state.done[x[0]]?"checked":""} onchange="toggle('${x[0]}')"><b>${x[1]}</b></label>`).join("")}</section></div>`}
function performance(){return `<div class="grid"><section class="card s6"><h3>Performance tracking</h3><div class="form"><label>Gym strength<select onchange="state.strength=this.value;save()"><option ${state.strength=="Improving"?"selected":""}>Improving</option><option ${state.strength=="Stable"?"selected":""}>Stable</option><option ${state.strength=="Declining"?"selected":""}>Declining</option></select></label><label>Body-fat % (optional)<input value="${state.bodyfat}" placeholder="Measured value" onchange="state.bodyfat=this.value;save()"></label></div></section><section class="card s6"><h3>Performance rules</h3><p>Track strength, acceleration/sprint data, training performance, match performance and your own 1–10 rating.</p><p class="muted">If weight falls while recovery, energy or strength deteriorate for ~2 weeks, the deficit should be reduced and reviewed.</p></section><section class="card s12"><h3>Body composition</h3><div class="row"><span>Current weight</span><b>${state.weight} kg</b></div><div class="row"><span>Christmas target</span><b>≤65 kg</b></div><p class="muted">Use a consistent professional body-fat measurement where possible rather than guessing a percentage.</p></section></div>`}
const days=[["MON","MD+1","Hard session if non-starter / yoga if starter","Recovery-dependent"],["TUE","OFF","Rest + controlled deficit","Recovery / body-composition day"],["WED","ACCEL / DECEL","1.5–2h pitch + heavy explosive gym","High neuromuscular load"],["THU","11v11","2h+ pitch + higher-rep gym","High total load"],["FRI","OFF","Rest + controlled deficit","Recovery / body-composition day"],["SAT","MD-1","1–1.5h light training","Match preparation"],["SUN","MATCH","2pm match","Performance day"]];
function calendar(){return `<div class="grid"><section class="card s8"><h3>Football week</h3>${days.map(d=>`<div class="item"><span class="time">${d[0]}</span><span><b>${d[1]}</b><br>${d[2]}<br><span class="muted">${d[3]}</span></span></div>`).join("")}</section><section class="card s4"><h3>Two-match week</h3><p>Turn this on when an extra match is added.</p><button class="choice ${state.twoMatch?"selected":""}" onclick="state.twoMatch=!state.twoMatch;save();render()">${state.twoMatch?"⚠ TWO-MATCH WEEK ON":"Turn on two-match mode"}</button>${state.twoMatch?'<div class="notice"><b>Performance + recovery priority.</b><br>Do not compensate for higher food intake by under-fuelling.</div>':""}</section></div>`}
function profile(){return `<div class="grid"><section class="card s6"><h3>Goals</h3><p><b>Performance:</b> best possible pitch performance</p><p><b>Recovery:</b> sleep, hydration and readiness</p><p><b>Body composition:</b> gradual fat loss while preserving muscle</p></section><section class="card s6"><h3>Preferences</h3><p>Asian • spicy • fish • eggs • steak • chicken</p><p>Rice • pasta • bread</p><p>Simple, practical meals with ingredient reuse.</p></section><section class="card s12"><h3>Coach settings</h3><p class="muted">Direct coaching style. Reminders should be purposeful, not constant.</p><button class="primary" onclick="if(confirm('Reset app data?')){localStorage.removeItem('nobleHub');location.reload()}">Reset app data</button></section></div>`}
function toggle(k){state.done[k]=!state.done[k];save();render()}function update(){state.recovery=+r.value;state.sleep=+s.value;state.weight=+w.value;state.energy=+e.value;save();render()}
function render(){nav();date.textContent=new Date().toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"});main.innerHTML=state.tab=="Home"?home():state.tab=="Nutrition"?nutrition():state.tab=="Recovery"?recovery():state.tab=="Performance"?performance():state.tab=="Calendar"?calendar():profile()}
render();
if ('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js'));</script>
</body>
</html>
